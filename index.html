<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học từ tiếng Trung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* VOICE: focused study deck, friendly but calm
   IDEA: a stack of index cards on a desk, the card is the hero
   PICTURE: the big flip card / question card at the top of each mode
   COLOUR and TYPE: white ground, ink #1b1b1f, vermilion #d42a20 accent, jade #0f7a5c correct; Noto Serif SC hanzi, Be Vietnam Pro UI
   LAYOUT: title + set filter, mode tabs, one stage card, controls under it */
:root{color-scheme:light dark;--bg:light-dark(#f6f5f3,#121214);--card:light-dark(#ffffff,#1d1d21);--ink:light-dark(#1b1b1f,#ecebe7);--mut:light-dark(#6b6b72,#9d9ca3);--line:light-dark(#e4e2df,#2e2e33);--red:light-dark(#d42a20,#ff5a4d);--ok:light-dark(#0f7a5c,#3fcf9f);--okbg:light-dark(#e3f4ec,#123a2d);--nobg:light-dark(#fbe6e4,#3d1715)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1260px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px) 48px}
.cols{display:grid;grid-template-columns:minmax(0,1fr)}.cols>.main{max-width:820px;width:100%;margin:0 auto}
.gram{max-width:820px;width:100%;margin:12px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.gram h2{font-size:18px;margin:0 0 8px}.gs{font-size:28px;margin:0;line-height:1.3}
.gt{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:14px}.gt td{border-top:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}.gt td.hz{font-size:20px;white-space:nowrap}.gt td.py{color:var(--red);white-space:nowrap}
.gp{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.gp b{color:var(--red)}.gp p{margin:4px 0 0;font-size:14.5px}
@media(min-width:1180px){.cols{grid-template-columns:minmax(0,820px) minmax(300px,390px);gap:24px;justify-content:center}.cols>.main{margin:0}.gram{margin:0;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto}}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:clamp(24px,4vw,32px);line-height:1.05;margin:0}
h1 span{font-family:"Noto Serif SC",serif;color:var(--red);margin-right:6px}
.tabs{display:flex;gap:6px;margin:16px 0 12px;overflow-x:auto;padding-bottom:2px}
button,select,input{font:inherit;color:var(--ink)}
.tabs button,.btn,select{font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;flex:none}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:500}
.btn.on{border-color:var(--red);color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
select{font-size:16px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stage{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);box-shadow:0 8px 24px -18px rgba(0,0,0,.35)}
.hz{font-family:"Noto Serif SC",serif;font-weight:500}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px}
/* flashcard */
.flip{perspective:1400px;cursor:pointer;height:clamp(240px,42vw,340px)}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.back .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.face.b{transform:rotateY(180deg)}
.face .hz{font-size:clamp(56px,13vw,104px);line-height:1.1}
.face .py{font-size:clamp(20px,3.5vw,26px);color:var(--red)}
.face .vi{font-size:clamp(20px,3.6vw,28px);font-weight:700;margin-top:4px}
.star{position:absolute;top:10px;right:12px;background:none;border:0;font-size:24px;cursor:pointer;color:var(--mut);min-height:44px;min-width:44px;z-index:2}
.star.on{color:#e0a800}
.q{font-size:clamp(20px,3.6vw,28px);font-weight:700;margin:6px 0 14px}
.q .hz{font-size:clamp(48px,11vw,84px);font-weight:500;display:block;line-height:1.15}
.lbl{font-size:14px;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:58px;padding:10px 14px;text-align:start;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px}
.opt .hz{font-size:26px}
.opt kbd{font-size:12px;color:var(--mut);margin-right:8px;font-family:inherit}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--red);background:var(--nobg)}
.typ{display:flex;gap:8px;flex-wrap:wrap}
.typ input{flex:1 1 220px;font-size:18px;min-height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;display:none}
.fb.ok{display:block;background:var(--okbg)}.fb.no{display:block;background:var(--nobg)}
.fb b{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;padding:8px;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .25s,transform .25s}
.tile .hz{font-size:32px}
.tile.sel{border-color:var(--red)}.tile.no{background:var(--nobg);border-color:var(--red)}
.tile.gone{opacity:0;transform:scale(.9);pointer-events:none}
.big{font-size:clamp(40px,8vw,64px);font-weight:700;line-height:1.05}
.res{list-style:none;padding:0;margin:14px 0 0}
.res li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline}
.res .hz{font-size:24px}
.small{font-size:13px;color:var(--mut)}
.hide{display:none!important}
.note{font-size:13px;color:var(--mut);margin-top:16px}
.cult{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.realm{font-weight:700;font-size:17px}.realm small{font-weight:400;color:var(--mut);font-size:14px;margin-left:6px}
.xpbar{flex:1 1 160px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#e0a800,var(--red));transition:width .4s}
.xpn{font-size:13px;color:var(--mut);white-space:nowrap}.fire{font-weight:700;white-space:nowrap}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-200%);visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;z-index:9;transition:transform .35s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
.tower{display:flex;flex-direction:column;gap:8px}
.floor{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:start;cursor:pointer;min-height:58px}
.floor .n{font-weight:700;font-size:20px;color:var(--red);text-align:center}
.floor .t{font-weight:500}.floor .s{font-size:13px;color:var(--mut)}
.floor.lock{opacity:.45;cursor:not-allowed}.floor.cur{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.floor .st{color:#e0a800;letter-spacing:2px;white-space:nowrap}
.plist{list-style:none;padding:0;margin:14px 0 0;counter-reset:n}
.plist li{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plist .no{color:var(--mut);font-size:14px;text-align:right}
.plist .ans{font-family:"Noto Serif SC",serif;font-size:28px;line-height:1.2;cursor:pointer;min-height:44px;display:flex;align-items:center;border-radius:8px}
.plist .ans.hid{color:transparent;background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.plist .ans.hid.v{font-family:inherit}
.plist .ans.hid *{color:transparent!important}
.plist .cue b{display:block}.plist .cue span{color:var(--red);font-size:15px}
.plist .mk{min-height:40px;min-width:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.plist .mk.on{border-color:var(--ok);background:var(--okbg)}
@media(max-width:600px){.plist li{grid-template-columns:26px minmax(0,1fr) auto;}.plist .ans{grid-column:2}}
.ord{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:10px;border-radius:12px;border:1.5px dashed var(--line);margin-bottom:10px;align-items:center}.ord.pool{border:0;padding:0}
.chip{font-family:"Noto Serif SC",serif;font-size:22px;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer}.chip.on{border-color:var(--red)}
.btn:disabled,.chip:disabled{opacity:.55;cursor:not-allowed}
.spk{display:flex;justify-content:center;margin:6px 0 16px}
.form{display:grid;gap:6px;max-width:360px}.form input{font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:16px 0 6px}.dd{border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:13px;display:flex;flex-direction:column}.dd.on{background:var(--okbg);border-color:var(--ok)}.dd.td{outline:2px solid var(--red);outline-offset:1px}.spk button{width:96px;height:96px;border-radius:50%;font-size:40px;border:2px solid var(--red);background:var(--bg);cursor:pointer}
@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:84px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="cols"><div class="main">
<header>
  <h1><span>学</span>Học từ tiếng Trung</h1>
  <div class="bar">
    <select id="set" aria-label="Chọn nhóm từ"></select>
    <button class="btn" id="starOnly" aria-pressed="false">★ Chỉ từ gắn sao</button>
  </div>
</header>
<div class="cult" id="cult"></div>
<div class="toast" id="toast" role="status"></div>
<div class="tabs" role="tablist">
  <button role="tab" data-m="plan" aria-selected="true">Lộ trình</button>
  <button role="tab" data-m="tower" aria-selected="false">Vượt màn</button>
  <button role="tab" data-m="skills" aria-selected="false">Nghe Nói Đọc Viết</button>
  <button role="tab" data-m="hskk" aria-selected="false">Luyện nói HSKK</button>
  <button role="tab" data-m="cards" aria-selected="false">Thẻ ghi nhớ</button>
  <button role="tab" data-m="paper" aria-selected="false">Viết ra giấy</button>
  <button role="tab" data-m="learn" aria-selected="false">Học</button>
  <button role="tab" data-m="write" aria-selected="false">Gõ đáp án</button>
  <button role="tab" data-m="test" aria-selected="false">Kiểm tra</button>
  <button role="tab" data-m="match" aria-selected="false">Ghép thẻ</button>
  <button role="tab" data-m="exam" aria-selected="false">Thi thử HSK</button>
</div>
<section class="stage" id="stage"></section>
<p class="note" id="note"></p>
</div><aside class="gram hide" id="gram" aria-live="polite"></aside></div>
</div>

const ALL=RAW.map((r,i)=>({id:i,h:r[0],p:r[1],v:r[2],g:r[3]}));

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('qz-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('qz-'+k,JSON.stringify(v))}catch(e){}}};
let stars=new Set(store.get('stars',[]));
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const nPy=s=>s.toLowerCase().replace(/[\s'’…·-]/g,'');
const nVi=s=>s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[.,;:!?"]/g,' ').replace(/\s+/g,' ').trim();
function checkPy(ans,w){const a=nPy(ans);if(!a)return 0;if(a===nPy(w.p))return 2;if(strip(a)===strip(nPy(w.p)))return 1;return 0}
function checkVi(ans,w){const a=nVi(ans);if(!a)return 0;const parts=[nVi(w.v),...w.v.split(/[,/;]/).map(nVi)].filter(Boolean);
  if(parts.includes(a))return 2;if(parts.map(strip).includes(strip(a)))return 1;return 0}
let ZH=null;const pickV=()=>{try{const vs=speechSynthesis.getVoices();ZH=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/natural|online|neural/i.test(v.name))||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}catch(e){}};
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
let sayT=0;
function say(t){try{const s=speechSynthesis;const go=()=>{const u=new SpeechSynthesisUtterance(t.replace(/…/g,''));u.lang='zh-CN';u.rate=.85;u.volume=.9;if(!ZH)pickV();if(ZH)u.voice=ZH;s.speak(u)};
  clearTimeout(sayT);if(s.speaking||s.pending){s.cancel();sayT=setTimeout(go,120)}else go()}catch(e){}}
const groups=["Chào hỏi & giao tiếp", "Người & đại từ", "Quốc gia & ngôn ngữ", "Số đếm & tiền", "Thời gian", "Vị trí & địa điểm", "Phương tiện đi lại", "Ăn uống & mua bán", "Học tập & công việc", "Sở thích & hoạt động", "Từ hỏi, hư từ & tính từ"];
$('set').innerHTML=`<option value="*">Tất cả (${ALL.length} từ)</option>`+groups.map(g=>`<option value="${esc(g)}">${esc(g)} (${ALL.filter(w=>w.g===g).length})</option>`).join('');
const sv=store.get('set','*');if([...$('set').options].some(o=>o.value===sv))$('set').value=sv;
let starOnly=store.get('staronly',false);
function words(){let w=$('set').value==='*'?ALL:ALL.filter(x=>x.g===$('set').value);if(starOnly)w=w.filter(x=>stars.has(x.id));return w}
function distract(w,n,key){return shuf(ALL.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,n)}
const st=$('stage');let mode='cards',keyH=null;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;if(keyH&&!(e.target.tagName==='INPUT'&&!['Enter'].includes(e.key)))keyH(e)});
function empty(){st.innerHTML=`<p class="q">Chưa có từ nào.</p><p class="lbl">${starOnly?'Bạn chưa gắn sao từ nào trong nhóm này. Bấm ☆ trên thẻ để gắn sao.':'Nhóm này trống.'}</p>`;keyH=null}

/* ---------- LEVEL: điểm, level, chuỗi ngày ---------- */
let XP=store.get('xp',0),STK=store.get('streak',{d:null,n:0});
const dayN=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*6e4)/864e5)};
/* Level L cần 100×L điểm để lên L+1 */
function realmOf(x){const L=Math.floor((1+Math.sqrt(1+8*x/100))/2),lo=50*L*(L-1),hi=50*(L+1)*L;return{i:L,name:'Level '+L,f:(x-lo)/(hi-lo),lo,hi}}
function cult(){const r=realmOf(XP),today=dayN(),alive=STK.d===today||STK.d===today-1;
  $('cult').innerHTML=`<span class="realm">${r.name}</span><div class="xpbar" title="${XP} điểm"><i style="width:${(r.f*100).toFixed(1)}%"></i></div><span class="xpn">${XP} / ${r.hi} điểm</span><span class="fire" title="Chuỗi ngày học liên tục">🔥 ${alive?STK.n:0} ngày</span>`}
function touchStreak(){const today=dayN();if(STK.d!==today){STK={d:today,n:STK.d===today-1?STK.n+1:1};store.set('streak',STK);if(STK.n>1)toast(`🔥 Chuỗi ${STK.n} ngày liên tục!`)}cult()}
let toastT=0;function toast(m){$('toast').textContent=m;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('on'),2600)}
function gain(n){if(!n)return;const before=realmOf(XP);XP+=n;store.set('xp',XP);mark('xp',n);
  touchStreak();
  const after=realmOf(XP);if(after.i>before.i)toast(`🎉 Lên ${after.name}!`);cult()}

/* câu nghe: nghe phát âm, chọn nghĩa hoặc chữ Hán */
function listenQ(w,head,onAns,onNext,toHan){
  const key=toHan?'h':'v',opts=shuf([w,...distract(w,3,key)]);
  st.innerHTML=`${head}<div class="lbl">Nghe rồi chọn ${toHan?'chữ Hán':'nghĩa'} đúng</div><div class="spk"><button id="pl" aria-label="Nghe lại">🔊</button></div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-id="${o.id}"><kbd>${k+1}</kbd>${toHan?`<span class="hz">${esc(o.h)}</span>`:esc(o.v)}</button>`).join('')}</div>
  <div class="fb" id="fb"></div><div class="bar hide" id="go" style="margin-top:12px"><button class="btn pri" id="cont">Tiếp tục (Enter)</button></div>`;
  $('pl').onclick=()=>say(w.h);setTimeout(()=>say(w.h),250);
  let done=false;const pick=b=>{if(done)return;done=true;const ok=+b.dataset.id===w.id;b.classList.add(ok?'ok':'no');st.querySelector(`.opt[data-id="${w.id}"]`).classList.add('ok');
    $('fb').className='fb '+(ok?'ok':'no');$('fb').innerHTML=`<b>${ok?'Chính xác!':'Chưa đúng'}</b><span class="hz">${esc(w.h)}</span> · ${esc(w.p)} · ${esc(w.v)}`;gain(ok?12:0);onAns(ok);
    $('go').classList.remove('hide');$('cont').focus();$('cont').onclick=onNext};
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
  keyH=e=>{if(!done&&/^[1-4]$/.test(e.key))pick(st.querySelectorAll('.opt')[e.key-1]);else if(!done&&e.key===' '){e.preventDefault();say(w.h)}else if(done&&e.key==='Enter'){e.preventDefault();onNext()}}}

/* ---------- VƯỢT MÀN ---------- */
const FLOORS=(()=>{const f=[];groups.forEach(g=>{const ws=ALL.filter(w=>w.g===g);const n=Math.max(1,Math.round(ws.length/10));for(let k=0;k<n;k++){const part=ws.slice(Math.floor(k*ws.length/n),Math.floor((k+1)*ws.length/n));f.push({g,k:k+1,n,ws:part})}});return f})();
let TS=store.get('tower',{});
function tower(){const top=FLOORS.findIndex((f,i)=>!(TS[i]>0));
  st.innerHTML=`<div class="q">Vượt màn · ${FLOORS.length} màn</div><p class="lbl">Mỗi màn 10 câu (chọn nghĩa, nghe, gõ pinyin…). Đúng từ 80% trở lên thì qua màn và mở màn tiếp theo. 100% được 3 sao.</p>
  <div class="tower">${FLOORS.map((f,i)=>({f,i})).reverse().map(({f,i})=>{const s=TS[i]||0,lock=i>0&&!(TS[i-1]>0);
    return `<button class="floor ${lock?'lock':''} ${i===top?'cur':''}" data-i="${i}" ${lock?'aria-disabled="true"':''}><span class="n">${i+1}</span><span><span class="t">${esc(f.g)}${f.n>1?' '+f.k+'/'+f.n:''}</span><br><span class="s">${f.ws.slice(0,6).map(w=>esc(w.h)).join(' · ')}${f.ws.length>6?' …':''}</span></span><span class="st">${lock?'🔒':'★'.repeat(s)+'☆'.repeat(3-s)}</span></button>`}).join('')}</div>`;
  keyH=null;st.querySelectorAll('.floor').forEach(b=>b.onclick=()=>{if(!b.classList.contains('lock'))climb(+b.dataset.i)});
  const c=st.querySelector('.floor.cur');if(c)setTimeout(()=>c.scrollIntoView({block:'center',behavior:'smooth'}),50)}
function climb(fi){const f=FLOORS[fi],pool=shuf(f.ws),qs=[];for(let k=0;k<10;k++)qs.push(pool[k%pool.length]);
  const R={i:0,ok:0,wrong:[]},kinds=['mcq','listen','rev','type','tf','listenH','mcq','type','listen','rev'];
  const next=()=>{if(R.i>=qs.length)return done();const w=qs[R.i],head=`<div class="prog"><i style="width:${R.i*10}%"></i></div><div class="meta"><span>Màn ${fi+1} · câu ${R.i+1}/10</span><span>Đúng ${R.ok}</span></div>`;
    const on=ok=>{if(ok)R.ok++;else if(!R.wrong.includes(w))R.wrong.push(w)},nx=()=>{R.i++;next()},k=kinds[R.i];
    if(k==='mcq')mcq(w,head,on,nx);else if(k==='rev')mcq(w,head,on,nx,true);else if(k==='type')typeQ(w,'p',head,on,nx);else if(k==='tf')tf(w,head,on,nx);else listenQ(w,head,on,nx,k==='listenH')};
  const done=()=>{const pct=R.ok*10,s=pct===100?3:pct>=90?2:pct>=80?1:0,first=!(TS[fi]>0)&&s>0;
    if(s>(TS[fi]||0)){TS[fi]=s;store.set('tower',TS)}gain(first?100:s?20:0);
    st.innerHTML=`<div class="lbl">Màn ${fi+1}: ${esc(f.g)}</div><div class="big" style="color:${s?'var(--ok)':'var(--red)'}">${pct}%</div><p style="font-size:24px;color:#e0a800;margin:4px 0">${'★'.repeat(s)}${'☆'.repeat(3-s)}</p>
    <p>${s?(first?'Qua màn! +100 điểm. Màn tiếp theo đã mở.':'Đã qua màn.'):'Chưa đủ 80%. Ôn lại rồi thử tiếp nhé.'}</p>
    <div class="bar">${s&&fi+1<FLOORS.length?`<button class="btn pri" id="up">Màn ${fi+2} →</button>`:''}<button class="btn ${s?'':'pri'}" id="re">Chơi lại màn này</button><button class="btn" id="bk">Danh sách màn</button></div>
    ${R.wrong.length?`<ul class="res">${R.wrong.map(w=>`<li><span class="hz">${esc(w.h)}</span><span><span style="color:var(--red)">${esc(w.p)}</span> · ${esc(w.v)}</span></li>`).join('')}</ul>`:''}`;
    keyH=null;if($('up'))$('up').onclick=()=>climb(fi+1);$('re').onclick=()=>climb(fi);$('bk').onclick=tower};
  next()}

/* ---------- HỌC (thích ứng) ---------- */
const LSZ=20,LESS=[];for(let i=0;i<ALL.length;i+=LSZ)LESS.push(ALL.slice(i,i+LSZ));

function learn(){L=null;const cur=LESS.findIndex((_,i)=>!LS.done.includes(i)),last=LS.log[LS.log.length-1],tot=Object.values(LS.prog).reduce((s,p)=>s+nKnown(p),0);

  ${last?`<p class="small">Lần lưu gần nhất: Bài ${last.l+1}, thuộc ${last.n} từ, ${new Date(last.t).toLocaleDateString('vi-VN')}. Tổng đã thuộc: ${tot}/${ALL.length} từ.</p>`:''}
  <div class="bar" style="margin-bottom:12px">${cur>=0?`<button class="btn pri" id="c0">▶ ${LS.prog[cur]?'Tiếp tục':'Bắt đầu'} Bài ${cur+1}</button>`:''}<button class="btn" id="free">Học tự do theo nhóm đang chọn</button></div>
  <div class="tower">${LESS.map((ws,i)=>{const d=LS.done.includes(i),p=LS.prog[i];
    return `<button class="floor ${i===cur?'cur':''}" data-i="${i}"><span class="n">${i+1}</span><span><span class="t">Bài ${i+1}</span><br><span class="s">${ws.slice(0,6).map(w=>esc(w.h)).join(' · ')} …</span></span><span class="small">${d?'✓ Xong':p?nKnown(p)+'/'+ws.length:''}</span></button>`}).join('')}</div>`;
  keyH=null;st.querySelectorAll('.floor').forEach(b=>b.onclick=()=>startLesson(+b.dataset.i));$('free').onclick=startFree;if($('c0'))$('c0').onclick=()=>startLesson(cur)}
function startLesson(i){const p=LS.prog[i],fresh=!p||Object.values(p).every(v=>v>=2);
  L={lesson:i,lv:fresh?Object.fromEntries(LESS[i].map(x=>[x.id,0])):{...p},round:[],ri:0};nextLearn()}
function startFree(){const w=words();if(!w.length)return empty();L={lesson:null,lv:Object.fromEntries(w.map(x=>[x.id,0])),round:[],ri:0};nextLearn()}
function saveLesson(fin){const i=L.lesson,n=nKnown(L.lv);LS.prog[i]={...L.lv};if(fin&&!LS.done.includes(i))LS.done.push(i);
  LS.log.push({t:Date.now(),l:i,n});LS.log=LS.log.slice(-90);store.set('lessons',LS);touchStreak();return n}
function nextLearn(){const ids=Object.keys(L.lv).map(Number),left=ids.filter(i=>L.lv[i]<2);
  const done=ids.length-left.length;
  if(L.lesson!=null){LS.prog[L.lesson]={...L.lv};store.set('lessons',LS);mark('lesson')}
  if(!left.length&&L.lesson!=null){const i=L.lesson;saveLesson(true);gain(50);
    st.innerHTML=`<div class="big">Xong Bài ${i+1}!</div><p>Đã thuộc cả ${ids.length} từ. Đã lưu bài, +50 điểm.</p><div class="bar">${i+1<LESS.length?`<button class="btn pri" id="nxl">Bài ${i+2} →</button>`:''}<button class="btn" id="bkl">Danh sách bài</button><button class="btn" id="again">Học lại bài này</button></div>`;
    if($('nxl'))$('nxl').onclick=()=>startLesson(i+1);$('bkl').onclick=learn;$('again').onclick=()=>startLesson(i);keyH=null;return}
  if(!left.length){st.innerHTML=`<div class="big">Xong!</div><p>Bạn đã thuộc cả ${ids.length} từ ở hai bước: chọn nghĩa và gõ pinyin.</p><div class="bar"><button class="btn pri" id="again">Học lại từ đầu</button></div>`;$('again').onclick=startFree;keyH=null;return}
  if(L.ri>=L.round.length){L.round=shuf(left).slice(0,7);L.ri=0}
  const w=ALL[L.round[L.ri]],lv=L.lv[w.id];

  if(lv===0)mcq(w,head,ok=>{L.lv[w.id]=ok?1:0;L.ri++;},nextLearn);
  else typeQ(w,'p',head,ok=>{L.lv[w.id]=ok?2:0;L.ri++;},nextLearn);
  if($('svl'))$('svl').onclick=()=>{const n=saveLesson(false);toast(`💾 Đã lưu Bài ${L.lesson+1}: thuộc ${n}/${ids.length} từ. Lần sau học tiếp từ đây.`);learn()}}

function result(name,ok,n,wrong,again){mark('review');const pct=Math.round(ok/n*100);
  st.innerHTML=`<div class="lbl">${esc(name)}: kết quả</div><div class="big" style="color:${pct>=80?'var(--ok)':pct>=50?'inherit':'var(--red)'}">${pct}%</div><p>Đúng ${ok}/${n} câu.</p>

  ${wrong.length?`<ul class="res">${wrong.map(w=>`<li><span class="hz">${esc(w.h)}</span><span><span style="color:var(--red)">${esc(w.p)}</span> · ${esc(w.v)}</span></li>`).join('')}</ul>`:''}`;

function startMatch(w){const pick=shuf(w).slice(0,6),tiles=shuf(pick.flatMap(x=>[{id:x.id,t:'h',s:x.h},{id:x.id,t:'v',s:x.v}]));

const SKILLS={listen:['🎧','Nghe','Nghe câu chọn nghĩa · nghe từ gõ pinyin'],speak:['🗣️','Nói','Đọc to từ và câu, máy nghe và chấm (hoặc tự chấm)'],read:['📖','Đọc','Đọc câu chữ Hán, chọn nghĩa đúng'],writeS:['✍️','Viết','Sắp xếp từ thành câu · dịch Việt → Trung (gõ chữ Hán hoặc pinyin)']};

function skills(){

function skillRun(k){const w=shuf(words()),ss=shuf(SENT),R={i:0,ok:0,wrong:[]};
  const next=()=>{if(R.i>=10)return fin();const i=R.i,head=`<div class="prog"><i style="width:${i*10}%"></i></div><div class="meta"><span>${SKILLS[k][1]} · câu ${i+1}/10</span><span>Đúng ${R.ok}</span></div>`;

  const fin=()=>{const pct=R.ok*10;if(SK[k]==null||pct>SK[k]){SK[k]=pct;store.set('skills',SK)}mark('skills');gain(pct>=80?40:0);

    keyH=null;gram(null);$('ag').onclick=()=>skillRun(k);$('bk').onclick=skills};
  next()}
/* Nghe/Đọc câu: chọn nghĩa */

  st.innerHTML=`${head}<div class="lbl">${audio?'Nghe câu rồi chọn nghĩa đúng (Space: nghe lại)':'Đọc câu rồi chọn nghĩa đúng'}</div>

  let done=false;const pick=b=>{if(done)return;done=true;const ok=+b.dataset.id===s.id;b.classList.add(ok?'ok':'no');st.querySelector(`.opt[data-id="${s.id}"]`).classList.add('ok');if(!audio)say(s.h);gram(s,true);gain(ok?12:0);fbShow(ok,s,onAns,onNext)};

/* Nói: nhận giọng nói zh-CN nếu trình duyệt hỗ trợ, nếu không thì tự chấm */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function speakQ(x,head,onAns,onNext){
  st.innerHTML=`${head}<div class="lbl">Đọc to câu/từ này bằng tiếng Trung</div><div class="q"><span class="hz" style="font-size:clamp(30px,7vw,52px)">${esc(x.h)}</span>${esc(x.v)}<span class="lbl hide" id="pyh" style="display:block;font-weight:400">${esc(x.p)}</span></div>
  <div class="bar">${SR?'<button class="btn pri" id="mic">🎤 Bấm rồi nói</button>':''}<button class="btn" id="hint">Gợi ý pinyin</button><button class="btn" id="pl">🔊 Nghe mẫu</button><button class="btn" id="self">Tự chấm</button></div>
  <p class="small" id="heard" style="margin-top:10px">${SR?'':'Trình duyệt này không có nhận giọng nói. Đọc to, nghe mẫu rồi tự chấm.'}</p>
  <div class="bar hide" id="sg" style="margin-top:8px"><button class="btn" id="g1">✓ Nói được</button><button class="btn" id="g0">✗ Chưa được</button></div>${TAIL}`;
  gram(x,true);let done=false;const end=(ok,t)=>{if(done)return;done=true;$('sg').classList.add('hide');if($('mic'))$('mic').disabled=true;gain(ok?12:0);fbShow(ok,x,onAns,onNext,t)};

  if(SR)$('mic').onclick=()=>{let r;try{r=new SR()}catch(e){$('heard').textContent='Không bật được micro. Bấm "Tự chấm".';return}
    r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=5;$('mic').textContent='🎤 Đang nghe…';$('mic').disabled=true;
    r.onresult=e=>{const tgt=plain(x.h);let best=0,bt='';[...e.results[0]].forEach(a=>{const sc=sim(plain(dg(a.transcript)),tgt);if(sc>=best){best=sc;bt=a.transcript}});
      $('heard').textContent=`Máy nghe được: ${bt} (khớp ${Math.round(best*100)}%)`;
      if(best>=.8)end(true,'Phát âm tốt!');else{$('sg').classList.remove('hide');$('heard').textContent+=' · Nói lại, hoặc tự chấm nếu bạn thấy mình đúng.'}};
    r.onerror=e=>{$('heard').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Micro bị chặn trong trang này. Đọc to rồi bấm "Tự chấm".':'Không nghe rõ ('+e.error+'). Thử lại.'};

    try{r.start()}catch(e){$('heard').textContent='Không bật được micro. Bấm "Tự chấm".'}};
  keyH=e=>{if(done&&e.key==='Enter'){e.preventDefault();onNext()}}}
/* Viết: sắp xếp từ thành câu */
function orderQ(s,head,onAns,onNext){let pool=shuf(s.t.map((t,i)=>({t,i})));if(s.t.length>1&&pool.every((p,k)=>p.i===k))pool.reverse();const pick=[];let done=false;
  const check=()=>{if(done||pool.length)return;done=true;const ok=pick.map(p=>p.t).join('')===s.h;
    st.querySelectorAll('.chip').forEach(c=>c.disabled=true);$('chk').disabled=true;$('clr').disabled=true;say(s.h);gram(s,true);gain(ok?15:0);fbShow(ok,s,onAns,onNext)};
  const draw=()=>{st.innerHTML=`${head}<div class="lbl">Sắp xếp thành câu đúng</div><div class="q">${esc(s.v)}</div>
    <div class="ord">${pick.length?pick.map((p,k)=>`<button class="chip on" data-k="${k}">${esc(p.t)}</button>`).join(''):'<span class="small">Bấm các ô bên dưới theo đúng thứ tự. Bấm ô đã chọn để bỏ.</span>'}</div>
    <div class="ord pool">${pool.map((p,k)=>`<button class="chip" data-p="${k}">${esc(p.t)}</button>`).join('')}</div>
    <div class="bar" style="margin-top:12px"><button class="btn pri" id="chk" ${pool.length?'disabled':''}>Kiểm tra (Enter)</button><button class="btn" id="clr">Xóa</button></div>${TAIL}`;
    st.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pick.push(pool.splice(+b.dataset.p,1)[0]);draw()});
    st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{pool.push(pick.splice(+b.dataset.k,1)[0]);draw()});
    $('clr').onclick=()=>{pool.push(...pick.splice(0));draw()};$('chk').onclick=check;if(!pool.length)$('chk').focus()};
  gram(s,false);draw();
  keyH=e=>{if(e.key!=='Enter')return;e.preventDefault();if(done)onNext();else check()}}
/* Viết: dịch Việt → Trung, gõ chữ Hán (bộ gõ tiếng Trung) hoặc pinyin */
const nP=t=>nPy(t.replace(/[，。？！、,.?!]/g,''));
function transQ(x,head,onAns,onNext){

    const a=nP(v),b=nP(x.p);return a===b?2:strip(a)===strip(b)?1:0};
  const fin=r=>{if(done)return;done=true;const ok=r>0;$('ti').disabled=true;say(x.h);gram(x,true);gain(ok?20:0);
    fbShow(ok,x,onAns,onNext,r===2?'Chính xác!':r===1?'Đúng, nhưng thiếu/sai dấu thanh':r===-1?'Gần đúng, còn sai vài chữ':'Chưa đúng');

    $('ovr').onclick=()=>{gain(20);onAns(true);$('ovr').classList.add('hide');$('fb').className='fb ok';$('fb').querySelector('b').textContent='Đã tính là đúng'}};
  $('tf').onsubmit=e=>{e.preventDefault();if(done)return onNext();const v=$('ti').value;if(!v.trim())return;fin(grade(v))};
  $('idk').onclick=()=>fin(0);
  keyH=e=>{if(done&&e.key==='Enter'&&e.target.tagName!=='INPUT'){e.preventDefault();onNext()}}}

function rec(cont,onTxt,onErr,onEnd){if(!SR)return null;let r;try{r=new SR()}catch(e){onErr('not-allowed');return null}
  r.lang='zh-CN';r.continuous=cont;r.interimResults=cont;r.maxAlternatives=cont?1:5;r.onresult=onTxt;r.onerror=e=>onErr(e.error);r.onend=onEnd;
  try{r.start()}catch(e){onErr('not-allowed');return null}return r}
function hskk(){gram(null);const b=store.get('hskk',{});
  st.innerHTML=`<div class="q">Luyện nói HSKK sơ cấp</div><p class="lbl">Ba phần theo dạng bài thi HSKK sơ cấp. Máy chấm cần micro: mở app bằng link GitHub trên Chrome hoặc Edge. Không có micro thì nghe mẫu rồi tự chấm.</p>
  <div class="tower">${[['p1','1','Nghe và nhắc lại','10 câu ngắn, không hiện chữ'],['p2','2','Nghe câu hỏi và trả lời','10 câu hỏi đời thường, trả lời ngắn'],['p3','3','Nói theo chủ đề','Nói 90 giây về một chủ đề, có gợi ý và bài mẫu']].map(([k,n,t,s])=>`<button class="floor" data-k="${k}"><span class="n">${n}</span><span><span class="t">${t}</span><br><span class="s">${s}</span></span><span class="small">${b[k]!=null?'Cao nhất '+b[k]+'%':''}</span></button>`).join('')}</div>`;
  keyH=null;st.querySelectorAll('.floor').forEach(x=>x.onclick=()=>x.dataset.k==='p3'?topicMenu():hRun(x.dataset.k))}
function hRun(k){const pool=k==='p1'?shuf(SENT.filter(s=>s.t.length<=5)):shuf(QA),R={i:0,ok:0,wrong:[]},N=10,pn=k==='p1'?1:2;
  const next=()=>{if(R.i>=N)return fin();const x=pool[R.i%pool.length],head=`<div class="prog"><i style="width:${R.i*10}%"></i></div><div class="meta"><span>HSKK phần ${pn} · câu ${R.i+1}/${N}</span><span>Đạt ${R.ok}</span></div>`;
    const on=ok=>{if(ok)R.ok++;else R.wrong.push(x)},nx=()=>{R.i++;next()};k==='p1'?hRepeat(x,head,on,nx):hAnswer(x,head,on,nx)};
  const fin=()=>{const pct=R.ok*10,b=store.get('hskk',{});if(b[k]==null||pct>b[k]){b[k]=pct;store.set('hskk',b)}mark('hskk');gain(pct>=80?40:0);
    st.innerHTML=`<div class="lbl">HSKK phần ${pn}: kết quả</div><div class="big" style="color:${pct>=80?'var(--ok)':'var(--red)'}">${pct}%</div><p>Đạt ${R.ok}/${N} câu.</p><div class="bar"><button class="btn pri" id="ag">Làm lại</button><button class="btn" id="bk">Chọn phần khác</button></div>
    ${R.wrong.length?`<ul class="res">${R.wrong.map(x=>`<li><span class="hz">${esc(x.h)}</span><span><span style="color:var(--red)">${esc(x.p)}</span> · ${esc(x.v)}</span></li>`).join('')}</ul>`:''}`;
    keyH=null;$('ag').onclick=()=>hRun(k);$('bk').onclick=hskk};
  next()}
function hRepeat(x,head,onAns,onNext){
  st.innerHTML=`${head}<div class="lbl">Nghe rồi nhắc lại (Space: nghe lại)</div><div class="spk"><button id="pl" aria-label="Nghe lại">🔊</button></div>
  <div class="bar" style="justify-content:center">${SR?'<button class="btn pri" id="mic">🎤 Nhắc lại</button>':''}<button class="btn" id="shw">Hiện chữ</button><button class="btn" id="self">Tự chấm</button></div>

  <div class="bar hide" id="sg" style="justify-content:center;margin-top:8px"><button class="btn" id="g1">✓ Nói được</button><button class="btn" id="g0">✗ Chưa được</button></div>${TAIL}`;
  setTimeout(()=>say(x.h),250);gram(null);
  let done=false;const end=(ok,t)=>{if(done)return;done=true;$('sg').classList.add('hide');$('txt').classList.remove('hide');if($('mic'))$('mic').disabled=true;gain(ok?12:0);fbShow(ok,x,onAns,onNext,t)};
  $('pl').onclick=()=>say(x.h);$('shw').onclick=()=>$('txt').classList.remove('hide');$('self').onclick=()=>{say(x.h);$('sg').classList.remove('hide')};
  $('g1').onclick=()=>end(true,'Tự chấm: nói được');$('g0').onclick=()=>end(false,'Tự chấm: chưa được');
  if(SR)$('mic').onclick=()=>{$('mic').disabled=true;$('mic').textContent='🎤 Đang nghe…';
    rec(false,e=>{const tgt=plain(x.h);let best=0,bt='';[...e.results[0]].forEach(a=>{const sc=sim(plain(dg(a.transcript)),tgt);if(sc>=best){best=sc;bt=a.transcript}});
      $('heard').textContent=`Máy nghe được: ${bt} (khớp ${Math.round(best*100)}%)`;if(best>=.8)end(true,'Nhắc lại tốt!');else{$('heard').textContent+=' · Nghe lại rồi nhắc lại, hoặc tự chấm.';$('sg').classList.remove('hide')}},
      er=>{$('heard').textContent=micMsg(er)},()=>{if(!done&&$('mic')){$('mic').disabled=false;$('mic').textContent='🎤 Nhắc lại'}})};
  keyH=e=>{if(!done&&e.key===' '){e.preventDefault();say(x.h)}else if(done&&e.key==='Enter'){e.preventDefault();onNext()}}}
function hAnswer(x,head,onAns,onNext){
  st.innerHTML=`${head}<div class="lbl">Nghe câu hỏi rồi trả lời bằng tiếng Trung (Space: nghe lại)</div><div class="spk"><button id="pl" aria-label="Nghe lại">🔊</button></div>
  <p class="hz hide" id="txt" style="text-align:center;font-size:28px;margin:0 0 4px">${esc(x.h)}</p><p class="small hide" id="txv" style="text-align:center">${esc(x.p)} · ${esc(x.v)}</p>
  <div class="bar" style="justify-content:center">${SR?'<button class="btn pri" id="mic">🎤 Trả lời</button>':''}<button class="btn" id="shw">Hiện câu hỏi</button><button class="btn" id="self">Tự chấm</button></div>
  <p class="small" id="heard" style="text-align:center;margin-top:10px"></p>
  <div class="bar hide" id="sg" style="justify-content:center;margin-top:8px"><button class="btn" id="g1">✓ Trả lời được</button><button class="btn" id="g0">✗ Chưa được</button></div>${TAIL}
  <p class="small hide" id="samp" style="margin-top:10px">Trả lời mẫu: <span class="hz" style="font-size:20px">${esc(x.a)}</span> · ${esc(x.ap)}</p>`;
  setTimeout(()=>say(x.h),250);gram(null);
  const show=()=>{$('txt').classList.remove('hide');$('txv').classList.remove('hide')};
  let done=false;const end=(ok,t)=>{if(done)return;done=true;$('sg').classList.add('hide');show();$('samp').classList.remove('hide');if($('mic'))$('mic').disabled=true;gain(ok?12:0);fbShow(ok,x,onAns,onNext,t)};
  $('pl').onclick=()=>say(x.h);$('shw').onclick=show;$('self').onclick=()=>{$('samp').classList.remove('hide');$('sg').classList.remove('hide')};
  $('g1').onclick=()=>end(true,'Tự chấm: trả lời được');$('g0').onclick=()=>end(false,'Tự chấm: chưa được');
  if(SR)$('mic').onclick=()=>{$('mic').disabled=true;$('mic').textContent='🎤 Đang nghe…';
    rec(false,e=>{const ts=[...e.results[0]].map(a=>dg(a.transcript)),hit=ts.find(t=>x.k.test(t)&&plain(t).length>=3);
      $('heard').textContent='Máy nghe được: '+(hit||ts[0]||'');if(hit)end(true,'Trả lời được!');else{$('heard').textContent+=' · Chưa đúng ý câu hỏi. Nói lại, hoặc tự chấm.';$('sg').classList.remove('hide')}},
      er=>{$('heard').textContent=micMsg(er)},()=>{if(!done&&$('mic')){$('mic').disabled=false;$('mic').textContent='🎤 Trả lời'}})};
  keyH=e=>{if(!done&&e.key===' '){e.preventDefault();say(x.h)}else if(done&&e.key==='Enter'){e.preventDefault();onNext()}}}

  st.innerHTML=`<div class="lbl">Chủ đề</div><div class="q"><span class="hz" style="font-size:clamp(28px,6vw,40px)">${esc(t.h)}</span><span class="lbl" style="display:block;font-weight:400">${esc(t.p)} · ${esc(t.v)}</span></div>
  <div><b>Gợi ý ý chính</b><ul style="margin:6px 0 0;padding-left:20px">${t.hints.map(h=>`<li><span class="hz" style="font-size:18px">${esc(h[0])}</span> <span class="small">${esc(h[1])}</span></li>`).join('')}</ul></div>

  keyH=null;let txt='',blocked=false;
  const stop=()=>{topRun=false;clearInterval(topT);try{topR&&topR.stop()}catch(e){}if(!$('go3'))return;$('go3').textContent='🎤 Nói lại (90 giây)';$('after').classList.remove('hide');
    const n=plain(txt).length;$('cnt').textContent=SR&&!blocked?`Máy nghe được khoảng ${n} chữ. Mốc tham khảo cho sơ cấp: từ 40 chữ trở lên, đủ các ý gợi ý.`:'Đối chiếu với bài mẫu rồi tự chấm.'};

    if(SR&&!blocked){const start=()=>{topR=rec(true,e=>{let f='',im='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript;else im+=r[0].transcript}txt+=f;if($('live'))$('live').textContent=txt+im},

    else $('cnt').textContent='Không có nhận giọng nói ở đây: cứ nói to theo đồng hồ, xong tự chấm.'};
  $('g1').onclick=()=>{mark('hskk');gain(40);toast('✓ Đã ghi nhận bài nói, +40 điểm');topicMenu()};$('g0').onclick=()=>{mark('hskk');topicMenu()};
